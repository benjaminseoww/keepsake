openapi: 3.1.0
info:
  title: Keepsake write API
  version: "1.0.0"
  summary: Write-path contract for memories and reviews (Track B)
  description: |
    Write-path contract for the dashboard and any future client (mobile,
    integrations). Recall, turns and the trace are in `api-reads.yaml`.

    Every operation is an HTTP route in the Next.js client
    (`client/app/api`). The logic lives in `client/lib/writes.ts`; the
    routes and the dashboard's server actions both call it, so every
    surface gets the same rules.

    Resources:
    - `memories`: `GET`/`POST /api/memories`, `DELETE /api/memories/{id}`
    - corrections: `POST /api/memories/{id}/corrections` (a new memory
      that supersedes `{id}`; memories are never edited in place)
    - reviews: `GET /api/reviews`, `POST /api/memories/{id}/review`

    Auth: the `keepsake_session` cookie (JWT issued by the user service).
    Family (including the admin) can verify, deny, confirm a supersede,
    correct and forget. Caregivers can only add (403 otherwise).
    Margaret does not add memories in the MVP (A16).

    Every inserted memory has `schema_version: 1`. Status is
    `unverified` | `verified` | `superseded` | `retracted`. Scope is
    `family` | `caregiver` (A17). The stored author is
    `source: {user_id, name, role}` (A15). Review candidates are
    `{memory_id, supersedes: bool, rerank_score}` (A14). Do not write
    `expires_at` (A10).

    Supersede detection (`classify`) is still open (Q1). It sits behind
    one function (`client/lib/classify.ts`, called from `writes.ts`)
    with a placeholder rerank-2.5 cutoff and an optional Gemini judge
    that is off by default, so the method can change without changing
    this contract.

    Validation (A17, A18): every add and correct runs `validate` first.
    Empty text or text over 500 characters is 400. Gemini then splits
    the note into facts and rewrites relative dates ("tomorrow" becomes
    "on Sun Nov 15"). Clear dates are stored as `event_start` /
    `event_end` (BSON dates; recall never filters on them, A10) and
    returned as ISO strings. If Gemini or Voyage is unavailable, the
    write returns 503 `unavailable` and nothing is saved.

    Server actions: the dashboard's server actions call the same
    functions but have no HTTP status. They turn the documented bodies
    into form state; an error comes back as its `{error:{code,message}}`
    code and message, not a status.

    Readable scopes (A17): Margaret (recall only) and family both read
    `family` and `caregiver`; a caregiver reads `caregiver`.

    Examples use the seed household: Margaret (person), Anna (family,
    admin), David (family), Ravi (caregiver). ObjectIds are
    illustrative.

servers:
  - url: /
    description: Next.js client (`client/`)

tags:
  - name: Memories
    description: Add, list, correct and forget memories.
  - name: Review
    description: The pending queue, confirm and deny. Family only.

security:
  - cookieAuth: []

paths:
  /api/memories:
    get:
      operationId: listMemories
      tags: [Memories]
      summary: List live memories
      description: |
        `listMemories(session, status)` in `client/lib/writes.ts`.
        Returns memories the caller can read, newest first, at most
        200. Without `status`, returns `unverified` and `verified`.

        Family sees both scopes. A caregiver sees only the notes they
        wrote themselves (caregiver scope). Margaret gets 403.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MemoryStatus"
      responses:
        "200":
          description: Memories, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryList"
              example:
                memories:
                  - id: "672e00000000000000000021"
                    text: Physio is every second Tuesday now, not every week
                    status: unverified
                    scope: caregiver
                    flagged: true
                    from:
                      name: Ravi
                      role: caregiver
                    created_at: "2026-11-14T12:00:00-05:00"
                    supersedes: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createMemory
      tags: [Memories]
      summary: Family or caregiver adds a memory
      description: |
        `createMemory(session, input)` in `client/lib/writes.ts`. The
        dashboard's add forms call the same function. This is the one
        add endpoint for every writer (A15). Margaret cannot call it
        (403, A16).

        The author is `source: {user_id, name, role}`, from the session,
        never from the request body (R1, A15). The response shows it as
        `from: {name, role}`.

        The system runs `classify` over `verified` memories in all
        scopes (R19). The writer's chosen scope is used (R20); caregiver
        writes are always `caregiver`. Family writers may set `family`
        (the default) or `caregiver`.

        - **Caregiver:** saved `unverified` with `review` pending,
          `flagged: true`, and an audit `write`. Returns 201. A family
          member later confirms or denies it.
        - **Family, classify proposes a supersede, `confirm` not true:**
          returns 200 with `needs_confirmation` and saves nothing. The
          client shows "Are you sure? This will supersede <old>" and
          resends the same body with `confirm: true` and
          `confirm_supersedes` set to that old `memory_id` (A6, R21).
        - **Family, `confirm: true`:** the server re-runs classify and
          saves only if it still proposes `confirm_supersedes` and that
          memory is still `verified`. Then, in one transaction, the new
          memory is saved `verified` with `review` approved, the old one
          becomes `superseded`, and audit `approve` is written. Returns
          201. Otherwise 409 with a fresh `needs_confirmation` payload,
          and nothing is saved.
        - **Family, `confirm: true`, nothing left to supersede:** the
          conflict is gone, so the memory is saved `verified` with audit
          `write` (201), not a 409.
        - **Multi-fact note (A17):** when the text splits into more than
          one fact, the response is a `BatchResult` and each fact is
          classified on its own. If no fact needs confirmation, all are
          saved in one transaction (201, `saved: true`). If any fact
          needs confirmation, nothing is saved (200, `saved: false`) and
          each fact carries its own result, plus a `facts_token`. The
          client resends `facts[]` (the split facts exactly as returned,
          not the raw text) with `confirm: true`, the `facts_token`, and
          a `confirm_supersedes` on each fact it confirmed, so the second
          call is not re-split.
        - **`facts[]` is only a confirm resend:** every other add runs
          validate. `facts[]` without `confirm: true`, sent together with
          `text`, or without a `facts_token` that matches the facts is
          400 and nothing is saved. The token is an HMAC over the writer,
          the person and each fact's text and dates, so a changed text,
          a changed or invalid `event_start`/`event_end`, or an added or
          dropped fact is rejected. A one-fact note always uses the
          single-fact shapes.
        - **Family, no supersede:** saved `verified` with audit `write`.
          Returns 201.

        The response lists only candidates in the writer's readable
        scopes (A3). If the proposed old memory isn't readable by the
        writer, `proposed_supersedes` and `message` are null (R22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemoryRequest"
            examples:
              ravi_physio:
                $ref: "#/components/examples/RaviAddsPhysio"
              anna_dinner:
                $ref: "#/components/examples/AnnaDinnerChange"
              anna_dinner_confirm:
                $ref: "#/components/examples/AnnaDinnerConfirm"
              anna_no_supersede:
                $ref: "#/components/examples/AnnaAddNoSupersede"
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SavedWrite"
                  - $ref: "#/components/schemas/BatchResult"
              examples:
                caregiver_saved_pending:
                  summary: Ravi's physio note, waiting for family review. The proposed old memory is caregiver-scoped, so Ravi may see it (R22).
                  value:
                    saved: true
                    needs_confirmation: false
                    needs_family_review: true
                    memory_id: "672e00000000000000000021"
                    status: unverified
                    scope: caregiver
                    from:
                      name: Ravi
                      role: caregiver
                    event_start: null
                    event_end: null
                    audit_action: write
                    proposed_supersedes: "672e00000000000000000001"
                    message: This will supersede Physio visit is every Tuesday at 2pm
                    candidates:
                      - memory_id: "672e00000000000000000001"
                        text: Physio visit is every Tuesday at 2pm
                        author_name: Anna
                        created_at: "2026-10-25T10:00:00-04:00"
                        supersedes: true
                        rerank_score: 0.91
                family_confirmed:
                  summary: Anna resent with confirm=true
                  value:
                    saved: true
                    needs_confirmation: false
                    needs_family_review: false
                    memory_id: "672e00000000000000000022"
                    status: verified
                    scope: family
                    from:
                      name: Anna
                      role: family
                    event_start: null
                    event_end: null
                    proposed_supersedes: "672e00000000000000000002"
                    supersedes: "672e00000000000000000002"
                    message: This will supersede Anna is bringing dinner on Saturday Nov 14 at 6pm
                    audit_action: approve
                    candidates:
                      - memory_id: "672e00000000000000000002"
                        text: Anna is bringing dinner on Saturday Nov 14 at 6pm
                        author_name: Anna
                        created_at: "2026-11-14T09:00:00-05:00"
                        supersedes: true
                        rerank_score: 0.88
                family_saved_verified:
                  summary: Family write with no supersede
                  value:
                    saved: true
                    needs_confirmation: false
                    needs_family_review: false
                    memory_id: "672e00000000000000000024"
                    status: verified
                    scope: family
                    from:
                      name: Anna
                      role: family
                    event_start: null
                    event_end: null
                    audit_action: write
                    proposed_supersedes: null
                    message: null
                    candidates: []
        "200":
          description: Nothing saved yet. Ask the writer, then resend with confirm.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/NeedsConfirmation"
                  - $ref: "#/components/schemas/BatchResult"
              examples:
                family_needs_confirmation:
                  summary: Anna's dinner-time change, first submit
                  value:
                    needs_confirmation: true
                    old:
                      memory_id: "672e00000000000000000002"
                      text: Anna is bringing dinner on Saturday Nov 14 at 6pm
                      author_name: Anna
                      created_at: "2026-11-14T09:00:00-05:00"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConfirmMismatch"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/memories/{id}:
    delete:
      operationId: forgetMemory
      tags: [Memories]
      summary: Family forgets a memory
      description: |
        `forgetMemory(session, id)` in `client/lib/writes.ts`. Family
        only; caregivers get 403. The memory document and its embedding
        are deleted, and a content-free audit `forget` is written, in
        one transaction. Turns that already used the memory keep their
        snapshot of it.
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200":
          description: Forgotten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgetResult"
              example:
                forgotten: true
                memory_id: "672e00000000000000000003"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/memories/{id}/corrections:
    post:
      operationId: correctMemory
      tags: [Memories]
      summary: Family corrects a verified memory
      description: |
        `correctMemory(session, id, input)` in `client/lib/writes.ts`.
        Family only; caregivers get 403. A caregiver's correction is an
        add (`POST /api/memories`), which goes to family review.

        A correction never edits the memory in place. It creates a new,
        re-embedded memory that supersedes `{id}`, and the old one stays
        as `superseded` for the audit trail and the trace. The new
        memory inherits the old one's scope (R20). That's why this is a
        `POST` that returns a new `memory_id`, not a `PUT` on `{id}`.

        Without `confirm: true`, returns 200 with `needs_confirmation`
        and saves nothing (A6). Resend with `confirm: true` and
        `confirm_supersedes` set to `{id}`. In one transaction, the new
        memory is saved `verified`, `{id}` becomes `superseded`, and
        audit `approve` is written; returns 201. If `{id}` is no longer
        `verified` by then, 409 with a fresh `needs_confirmation`
        payload. 404 if `{id}` isn't a verified memory the caller can
        read (this includes an `unverified` memory). The replacement
        text is validated like an add and must be one fact: a
        correction that splits into more than one fact is 400. Gemini or
        Voyage down is 503, and nothing is saved.
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectMemoryRequest"
            examples:
              ask:
                $ref: "#/components/examples/AnnaCorrectPhysio"
              confirm:
                $ref: "#/components/examples/AnnaCorrectPhysioConfirm"
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedWrite"
              examples:
                confirmed:
                  summary: Anna resent with confirm=true
                  value:
                    saved: true
                    needs_confirmation: false
                    needs_family_review: false
                    memory_id: "672e00000000000000000023"
                    status: verified
                    scope: caregiver
                    from:
                      name: Anna
                      role: family
                    event_start: null
                    event_end: null
                    proposed_supersedes: "672e00000000000000000001"
                    supersedes: "672e00000000000000000001"
                    audit_action: approve
                    candidates: []
        "200":
          description: Nothing saved yet. Ask the writer, then resend with confirm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsConfirmation"
              examples:
                needs_confirmation:
                  summary: Anna corrects physio; waiting for confirm
                  value:
                    needs_confirmation: true
                    old:
                      memory_id: "672e00000000000000000001"
                      text: Physio visit is every Tuesday at 2pm
                      author_name: Anna
                      created_at: "2026-10-25T10:00:00-04:00"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConfirmMismatch"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/memories/{id}/review:
    post:
      operationId: reviewMemory
      tags: [Review]
      summary: Family confirms or denies a pending memory
      description: |
        `reviewMemory(session, id, decision)` in `client/lib/writes.ts`.
        Any family member (A12); caregivers get 403. Runs in one
        `session.withTransaction` (R3).

        - **confirm:** the memory becomes `verified`, `review.state`
          `approved`, `supersedes` set. The proposed old memory becomes
          `superseded` if it is still `verified`, even when the
          confirmer can't read it. Audit `approve`. With no proposal
          (or the old memory already gone), it's a plain verify: audit
          `verify`.
        - **deny:** the memory becomes `retracted`, `review.state`
          `denied`. The old memory is untouched. Audit `deny`.

        404 if `{id}` has no review in this household. 409 if the review
        was already decided.
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
            examples:
              confirm:
                summary: Anna confirms Ravi's physio change
                value:
                  decision: confirm
              deny:
                summary: Anna denies Ravi's newspaper note
                value:
                  decision: deny
      responses:
        "200":
          description: Decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecisionResponse"
              examples:
                approve_override:
                  summary: Confirm a proposed supersede
                  value:
                    decision: confirm
                    memory_id: "672e00000000000000000021"
                    new_status: verified
                    review_state: approved
                    supersedes: "672e00000000000000000001"
                    old_status: superseded
                    audit_action: approve
                    decided_by: anna
                    decided_at: "2026-11-14T12:10:00-05:00"
                plain_verify:
                  summary: Confirm with no proposal (David)
                  value:
                    decision: confirm
                    memory_id: "672e00000000000000000017"
                    new_status: verified
                    review_state: approved
                    supersedes: null
                    old_status: null
                    audit_action: verify
                    decided_by: david
                    decided_at: "2026-11-14T12:15:00-05:00"
                deny:
                  summary: Deny; the weekday-morning visit routine stays verified
                  value:
                    decision: deny
                    memory_id: "672e00000000000000000016"
                    new_status: retracted
                    review_state: denied
                    supersedes: null
                    old_status: null
                    audit_action: deny
                    decided_by: anna
                    decided_at: "2026-11-14T12:20:00-05:00"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/reviews:
    get:
      operationId: listReviews
      tags: [Review]
      summary: List pending reviews
      description: |
        `listReviews(session)` in `client/lib/writes.ts`, which the
        dashboard may also call directly (R23).

        Family only (any family member, including the admin).
        Caregivers get 403. Returns every memory with
        `review.state: pending` for the household, newest first. When
        `proposed_supersedes` is set, the old memory is looked up
        (text, author name, date) and `message` is
        "This will supersede <old text>".

        The queue shows every candidate, including ones the original
        writer could not see. Family can read both remaining scopes
        (A17).
      responses:
        "200":
          description: Pending review queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueue"
              examples:
                family_queue:
                  summary: Anna or David opens the review queue
                  value:
                    reviews:
                      - id: "672e00000000000000000021"
                        text: Physio is every second Tuesday now, not every week
                        status: unverified
                        scope: caregiver
                        flagged: true
                        from:
                          name: Ravi
                          role: caregiver
                        created_at: "2026-11-14T12:00:00-05:00"
                        message: This will supersede Physio visit is every Tuesday at 2pm
                        proposed_old:
                          memory_id: "672e00000000000000000001"
                          text: Physio visit is every Tuesday at 2pm
                          author_name: Anna
                          created_at: "2026-10-25T10:00:00-04:00"
                        review:
                          state: pending
                          proposed_supersedes: "672e00000000000000000001"
                          candidates:
                            - memory_id: "672e00000000000000000001"
                              text: Physio visit is every Tuesday at 2pm
                              author_name: Anna
                              created_at: "2026-10-25T10:00:00-04:00"
                              supersedes: true
                              rerank_score: 0.91
                          decided_by: null
                          decided_at: null
                      - id: "672e00000000000000000011"
                        text: Margaret's reading glasses are now kept on the bedside table
                        status: unverified
                        scope: caregiver
                        flagged: true
                        from:
                          name: Ravi
                          role: caregiver
                        created_at: "2026-11-13T16:00:00-05:00"
                        message: This will supersede Reading glasses are usually on the kitchen windowsill
                        proposed_old:
                          memory_id: "672e00000000000000000005"
                          text: Reading glasses are usually on the kitchen windowsill
                          author_name: Ravi
                          created_at: "2026-10-20T11:00:00-04:00"
                        review:
                          state: pending
                          proposed_supersedes: "672e00000000000000000005"
                          candidates:
                            - memory_id: "672e00000000000000000005"
                              text: Reading glasses are usually on the kitchen windowsill
                              author_name: Ravi
                              created_at: "2026-10-20T11:00:00-04:00"
                              supersedes: true
                              rerank_score: 0.86
                          decided_by: null
                          decided_at: null
                      - id: "672e00000000000000000016"
                        text: Ravi brings the newspaper with him on Monday visits
                        status: unverified
                        scope: caregiver
                        flagged: true
                        from:
                          name: Ravi
                          role: caregiver
                        created_at: "2026-11-13T06:00:00-05:00"
                        message: null
                        proposed_old: null
                        review:
                          state: pending
                          proposed_supersedes: null
                          candidates:
                            - memory_id: "672e00000000000000000007"
                              text: Ravi visits on weekday mornings at 10
                              author_name: Anna
                              created_at: "2026-10-25T10:00:00-04:00"
                              supersedes: false
                              rerank_score: 0.58
                          decided_by: null
                          decided_at: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: keepsake_session
      description: |
        JWT issued by the user service at login and stored in the
        `keepsake_session` cookie. Trust `user_id` only; resolve
        `person_id`, `role` and `admin` from `households.members`.

  parameters:
    MemoryId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"

  responses:
    BadRequest:
      description: The request is missing a required field or a value is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: bad_request
              message: text is required
    Unauthorized:
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: Sign in required
    Forbidden:
      description: The caller's role cannot perform this action (for example a caregiver confirming a review).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: Only a family member can confirm or deny a review
    NotFound:
      description: The memory does not exist, or it is not visible to this caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Memory not found
    Conflict:
      description: The review has already been confirmed or denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: This review has already been decided
    Unavailable:
      description: Gemini (validation) or Voyage (embedding, rerank) is unavailable. Nothing was saved; the client may retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unavailable
              message: Could not check this note right now. Please try again.
    ServerError:
      description: Unexpected failure, for example a transaction that could not commit. It rolled back and nothing was saved, so resending the same request is safe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: server_error
              message: Something went wrong. Nothing was saved. Please try again.
    ConfirmMismatch:
      description: |
        `confirm` was true but classify no longer proposes
        `confirm_supersedes`, or the old memory is no longer
        `verified` (R21). Nothing is saved. The body is a fresh
        `NeedsConfirmation` payload (a `BatchResult` with `saved: false`
        for a multi-fact resend), not the `{error:{code,message}}`
        shape. If the old memory was replaced and nothing new conflicts,
        the body is the error shape with code `conflict`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/NeedsConfirmation"
              - $ref: "#/components/schemas/BatchResult"
              - $ref: "#/components/schemas/Error"
          examples:
            different_proposal:
              summary: Classify now proposes a different verified memory
              value:
                needs_confirmation: true
                old:
                  memory_id: "672e00000000000000000003"
                  text: Margaret takes her morning tea with milk, no sugar, around 8
                  author_name: Anna
                  created_at: "2026-10-18T08:00:00-04:00"

  schemas:
    ObjectId:
      type: string
      pattern: "^[a-fA-F0-9]{24}$"
      description: MongoDB ObjectId, 24-character hex string.
      examples:
        - "672e00000000000000000001"

    Scope:
      type: string
      enum: [family, caregiver]

    MemoryStatus:
      type: string
      enum: [unverified, verified, superseded, retracted]

    ReviewState:
      type: string
      enum: [pending, approved, denied]

    Role:
      type: string
      enum: [person, family, caregiver]

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict, unavailable, server_error]
            message:
              type: string

    Candidate:
      type: object
      additionalProperties: false
      required: [memory_id, supersedes]
      properties:
        memory_id:
          $ref: "#/components/schemas/ObjectId"
        text:
          type: string
          description: Looked-up memory text, when the caller is allowed to read it.
        author_name:
          type: [string, "null"]
        created_at:
          type: [string, "null"]
          format: date-time
        supersedes:
          type: boolean
          description: Whether the new memory supersedes this candidate.
        rerank_score:
          type: [number, "null"]

    OldMemory:
      type: object
      additionalProperties: false
      description: The memory this write would supersede. The UI shows "Are you sure? This will supersede <text>".
      required: [memory_id, text, author_name, created_at]
      properties:
        memory_id:
          $ref: "#/components/schemas/ObjectId"
        text:
          type: string
        author_name:
          type: string
        created_at:
          type: string
          format: date-time

    NeedsConfirmation:
      type: object
      additionalProperties: false
      required: [needs_confirmation, old]
      properties:
        needs_confirmation:
          type: boolean
          const: true
        old:
          $ref: "#/components/schemas/OldMemory"

    AddMemoryRequest:
      type: object
      additionalProperties: false
      description: Send `text` on the first submit. On a confirm resend of a multi-fact note, send `facts` (the split facts from the BatchResult, unchanged) and `facts_token` instead, with `confirm` true.
      anyOf:
        - required: [text]
        - required: [facts]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        facts:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            Confirm resend of a multi-fact note: the facts exactly as
            the BatchResult returned them, each with its own
            `confirm_supersedes` when the user confirmed that fact. The
            server does not re-split them.
          items:
            $ref: "#/components/schemas/FactInput"
        facts_token:
          type: string
          description: The `facts_token` from the BatchResult. Required with `facts`.
        scope:
          $ref: "#/components/schemas/Scope"
          description: |
            The scope the writer chose (R20). Family writers may set
            `family` or `caregiver`. Ignored for caregivers (always
            `caregiver`).
        confirm:
          type: boolean
          default: false
          description: "Family only. Resend the same body with confirm=true after a needs_confirmation response."
        confirm_supersedes:
          $ref: "#/components/schemas/ObjectId"
          description: |
            Required when confirm is true (R21). The old memory_id
            shown in the needs_confirmation response. The server saves
            only if classify still proposes this id and the memory is
            still verified.
      allOf:
        - if:
            properties:
              confirm:
                const: true
            required: [confirm, text]
          then:
            required: [confirm_supersedes]
        - if:
            required: [facts]
          then:
            required: [confirm, facts_token]
            properties:
              confirm:
                const: true
            not:
              required: [text]

    FactInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        event_start:
          type: [string, "null"]
          format: date-time
        event_end:
          type: [string, "null"]
          format: date-time
        confirm_supersedes:
          $ref: "#/components/schemas/ObjectId"

    NotSaved:
      type: object
      additionalProperties: false
      description: A fact in a batch that was not saved because another fact needs confirmation.
      required: [saved, needs_confirmation]
      properties:
        saved:
          type: boolean
          const: false
        needs_confirmation:
          type: boolean
          const: false

    BatchFactResult:
      type: object
      additionalProperties: false
      required: [text, event_start, event_end, result]
      properties:
        text:
          type: string
          description: The fact as validate split and rewrote it (absolute dates).
        event_start:
          type: [string, "null"]
          format: date-time
        event_end:
          type: [string, "null"]
          format: date-time
        result:
          oneOf:
            - $ref: "#/components/schemas/SavedWrite"
            - $ref: "#/components/schemas/NeedsConfirmation"
            - $ref: "#/components/schemas/NotSaved"

    BatchResult:
      type: object
      additionalProperties: false
      description: Response for a note that split into more than one fact (A17).
      required: [batch, saved, facts]
      properties:
        batch:
          type: boolean
          const: true
        saved:
          type: boolean
          description: true when every fact was saved in one transaction; false when any fact needs confirmation and nothing was saved.
        facts_token:
          type: string
          description: Present only when `saved` is false. Send it back unchanged with `facts` on the confirm resend.
        facts:
          type: array
          items:
            $ref: "#/components/schemas/BatchFactResult"

    Source:
      type: object
      additionalProperties: false
      description: Stored author on the memory doc (A15). Resolved from the session and households.members; never taken from the request body.
      required: [user_id, name, role]
      properties:
        user_id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    From:
      type: object
      additionalProperties: false
      description: "Display form of the author (A15), shown on addMemory responses and review cards as from: {name, role}. Built from source.name and source.role, never from the request body."
      required: [name, role]
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    SavedWrite:
      type: object
      additionalProperties: false
      required: [saved, needs_confirmation, needs_family_review, memory_id, status, scope, from, event_start, event_end, candidates]
      properties:
        saved:
          type: boolean
          const: true
        needs_confirmation:
          type: boolean
          const: false
        needs_family_review:
          type: boolean
        memory_id:
          $ref: "#/components/schemas/ObjectId"
        status:
          $ref: "#/components/schemas/MemoryStatus"
        scope:
          $ref: "#/components/schemas/Scope"
        from:
          $ref: "#/components/schemas/From"
        event_start:
          type: [string, "null"]
          format: date-time
          description: Date resolved from the text by validate (stored as a BSON date). Null when there is no clear date.
        event_end:
          type: [string, "null"]
          format: date-time
          description: End of a range or an all-day event. Null otherwise.
        proposed_supersedes:
          description: |
            The proposed old memory_id. Omitted (or null) when there
            is no proposal, or when that old memory is not readable by
            the writer (R22).
          anyOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        supersedes:
          description: Set on a family write that was confirmed and has already replaced the old memory.
          anyOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        audit_action:
          type: string
          enum: [write, approve, verify]
        message:
          type: [string, "null"]
          description: |
            Present on a caregiver save that proposes a supersede the
            writer can read, so the UI can show "This will supersede
            <old>". Omitted when the old memory is not in the writer's
            readable scopes (R22).
        candidates:
          type: array
          description: |
            Candidates filtered to the writer's readable scopes (A3,
            R22). A candidate outside those scopes is omitted, even if
            it was the proposed supersede.
          items:
            $ref: "#/components/schemas/Candidate"

    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [confirm, deny]

    ReviewDecisionResponse:
      type: object
      additionalProperties: false
      required: [decision, memory_id, new_status, review_state, audit_action]
      properties:
        decision:
          type: string
          enum: [confirm, deny]
        memory_id:
          $ref: "#/components/schemas/ObjectId"
        new_status:
          $ref: "#/components/schemas/MemoryStatus"
        review_state:
          $ref: "#/components/schemas/ReviewState"
        supersedes:
          anyOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        old_status:
          description: Status of the proposed old memory after the decision. Null when there was no proposal.
          anyOf:
            - $ref: "#/components/schemas/MemoryStatus"
            - type: "null"
        audit_action:
          type: string
          enum: [approve, verify, deny]
        decided_by:
          type: string
          description: "user_id of the family member who decided."
        decided_at:
          type: string
          format: date-time

    ReviewItem:
      type: object
      additionalProperties: false
      required: [id, text, status, scope, flagged, from, created_at, review, proposed_old, message]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        text:
          type: string
        status:
          $ref: "#/components/schemas/MemoryStatus"
        scope:
          $ref: "#/components/schemas/Scope"
        flagged:
          type: boolean
        from:
          $ref: "#/components/schemas/From"
        created_at:
          type: string
          format: date-time
        message:
          type: [string, "null"]
          description: 'This will supersede <old text> when there is a proposal; otherwise null.'
        proposed_old:
          anyOf:
            - $ref: "#/components/schemas/OldMemory"
            - type: "null"
        review:
          type: object
          additionalProperties: false
          required: [state, proposed_supersedes, candidates]
          properties:
            state:
              $ref: "#/components/schemas/ReviewState"
            proposed_supersedes:
              anyOf:
                - $ref: "#/components/schemas/ObjectId"
                - type: "null"
            candidates:
              type: array
              items:
                $ref: "#/components/schemas/Candidate"
            decided_by:
              type: [string, "null"]
            decided_at:
              type: [string, "null"]
              format: date-time

    ReviewQueue:
      type: object
      additionalProperties: false
      required: [reviews]
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"

    CorrectMemoryRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Replacement text, re-embedded on save.
        confirm:
          type: boolean
          default: false
        confirm_supersedes:
          $ref: "#/components/schemas/ObjectId"
          description: |
            Required when confirm is true (R21). Must be the `{id}` in
            the path. The server saves only if that
            target still matches and the old memory is still verified.
      if:
        properties:
          confirm:
            const: true
        required: [confirm]
      then:
        required: [confirm_supersedes]

    MemoryItem:
      type: object
      additionalProperties: false
      required: [id, text, status, scope, flagged, from, created_at, supersedes]
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        text:
          type: string
        status:
          $ref: "#/components/schemas/MemoryStatus"
        scope:
          $ref: "#/components/schemas/Scope"
        flagged:
          type: boolean
        from:
          $ref: "#/components/schemas/From"
        created_at:
          type: string
          format: date-time
        supersedes:
          description: The memory this one replaced, if any.
          anyOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"

    MemoryList:
      type: object
      additionalProperties: false
      required: [memories]
      properties:
        memories:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/MemoryItem"

    ForgetResult:
      type: object
      additionalProperties: false
      required: [forgotten, memory_id]
      properties:
        forgotten:
          type: boolean
          const: true
        memory_id:
          $ref: "#/components/schemas/ObjectId"

  examples:
    RaviAddsPhysio:
      summary: Ravi adds a schedule change
      value:
        text: Physio is every second Tuesday now, not every week
    AnnaDinnerChange:
      summary: Anna changes dinner time, first submit
      value:
        text: Anna is bringing dinner at 7pm today, not 6
        scope: family
    AnnaDinnerConfirm:
      summary: Anna confirms the dinner-time change
      value:
        text: Anna is bringing dinner at 7pm today, not 6
        scope: family
        confirm: true
        confirm_supersedes: "672e00000000000000000002"
    AnnaAddNoSupersede:
      summary: Anna adds a fact that does not supersede anything
      value:
        text: Margaret's favourite biscuits are ginger snaps
        scope: family
    AnnaCorrectPhysio:
      summary: Anna corrects the weekly physio memory
      value:
        text: Physio is every second Tuesday now, not every week
    AnnaCorrectPhysioConfirm:
      summary: Anna confirms the physio correction
      value:
        text: Physio is every second Tuesday now, not every week
        confirm: true
        confirm_supersedes: "672e00000000000000000001"
